<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cenová mapa Pokémon TCG</title>
<meta name="description" content="Denné ceny a dostupnosť sealed Pokémon TCG produktov v CZ/SK eshopoch.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#f3f3f8; --surface:#fff; --surface-2:#ecebf3; --ink:#17162a; --muted:#615f7c;
  --line:#dcdae7; --accent:#3b36a5; --accent-soft:#e5e3f6; --gold:#a8701a; --gold-soft:#f5ecdb;
  --ok:#1c7350; --ok-soft:#dcefe5; --crit:#a83a2c; --crit-soft:#f7e3df;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#111120; --surface:#1a1a2c; --surface-2:#22223a; --ink:#eae8f6; --muted:#9b98b8;
  --line:#2f2e4a; --accent:#a49dff; --accent-soft:#25234a; --gold:#dda851; --gold-soft:#312712;
  --ok:#54c493; --ok-soft:#12301f; --crit:#ee8474; --crit-soft:#361b18;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5}
.mono,.num{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
a{color:var(--accent)}

.head-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn.scan{background:transparent;color:var(--accent);border:1px solid var(--line);font-size:13px;padding:7px 14px}
.btn.scan:hover:not(:disabled){border-color:var(--accent)}
.btn.scan:disabled{opacity:.55;cursor:default}
.scan-msg{font-size:12.5px;color:var(--muted);text-align:right;margin-top:6px;min-height:1em}
.scan-msg.err{color:var(--crit)}
.stale{background:var(--crit);color:#fff;padding:9px 20px;font-size:14px;text-align:center}
header{padding:30px 0 18px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
h1{font-size:27px;font-weight:700;margin:0;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--muted);margin-top:3px}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:11px}
.tab{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:500;
  padding:7px 16px;border-radius:8px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tab:focus-visible,.f:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:14px 0 20px;border-bottom:1px solid var(--line);margin-bottom:22px}
.f{font-family:"IBM Plex Mono",monospace;font-size:12px;padding:6px 11px;border-radius:8px;
  border:1px solid var(--line);color:var(--muted);background:var(--surface);cursor:pointer}
.f[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.f[aria-pressed="true"]{color:#14132a}}
.spacer{flex:1}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
#q{font:inherit;font-size:13px;padding:6px 11px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);min-width:220px}
#q:focus{outline:2px solid var(--accent);outline-offset:1px}
.pill.low{background:var(--accent-soft);color:var(--accent)}
.pill.eol{background:var(--surface-2);color:var(--muted)}
/* v portfóliu je plus dobrá správa — opačne než pri raste ceny v obchode */
.gain{color:var(--ok)} .loss{color:var(--crit)}
.pform{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin-bottom:20px}
.pform h3{margin:0 0 12px;font-size:15px}
.pform .grid{display:grid;grid-template-columns:2fr 70px 110px 90px 1.2fr 130px auto;gap:8px;align-items:end}
.pform label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.pform input,.pform select{font:inherit;font-size:13px;width:100%;padding:7px 9px;border-radius:8px;
  border:1px solid var(--line);background:var(--ground);color:var(--ink)}
.pform input:focus,.pform select:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-size:13px;font-weight:600;padding:8px 15px;border-radius:8px;border:1px solid var(--accent);
  background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap}
@media (prefers-color-scheme:dark){.btn{color:#14132a}}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.btn.ghost:hover{color:var(--crit);border-color:var(--crit)}
.pmsg{font-size:13px;margin-top:10px;color:var(--muted)}
.pmsg.err{color:var(--crit)}
.pmsg.ok{color:var(--ok)}
.unlock{max-width:56ch}
.unlock .row{display:flex;gap:8px;margin-top:12px}
@media (max-width:860px){.pform .grid{grid-template-columns:1fr 1fr}}
.port-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.port-sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.port-sum .lbl{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.port-sum .val{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;margin-top:4px}
.port-empty{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:22px 24px;max-width:70ch}
.port-empty h3{margin:0 0 10px;font-size:17px}
.port-empty p{font-size:14.5px;color:var(--muted);margin:0 0 12px}
.port-empty pre{background:var(--surface-2);border-radius:9px;padding:13px 15px;overflow-x:auto;
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.6;margin:0 0 12px;color:var(--ink)}
.keycopy{cursor:pointer;border:0;background:var(--surface-2);color:var(--muted);font:inherit;
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;padding:3px 8px;border-radius:6px}
.keycopy:hover{color:var(--accent)}
.count{font-size:12px;color:var(--muted)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--surface);
  display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit}
.card:hover{border-color:var(--accent)}
.thumb{aspect-ratio:4/3;background:var(--surface-2);display:flex;align-items:center;justify-content:center;position:relative}
.thumb img{width:100%;height:100%;object-fit:contain;padding:8px;position:absolute;inset:0;background:var(--surface-2)}
.thumb .ph{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
.tier{position:absolute;top:8px;left:8px;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
  padding:2px 7px;border-radius:6px}
.tier.A{background:var(--gold-soft);color:var(--gold)} .tier.B{background:var(--accent-soft);color:var(--accent)}
.tier.C{background:var(--surface-2);color:var(--muted)}
.cbody{padding:12px 13px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.ctitle{font-size:14px;font-weight:700;line-height:1.25}
.csub{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
.spark{width:100%;height:28px;display:block;color:var(--accent)}
.pill{display:inline-flex;font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:3px 8px;
  border-radius:999px;width:fit-content}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.no{background:var(--crit-soft);color:var(--crit)}
.pill.flag{background:var(--gold-soft);color:var(--gold)}
.prow{display:flex;align-items:baseline;gap:8px;margin-top:auto;flex-wrap:wrap}
.price{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:19px}
.pp{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
.delta{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600}
.delta.dn{color:var(--ok)} .delta.up{color:var(--crit)}

dialog{border:0;border-radius:14px;padding:0;max-width:900px;width:calc(100% - 32px);
  background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,10,22,.55)}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.dlg-head h2{margin:0;font-size:19px}
.close{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;
  font:inherit;padding:5px 11px;cursor:pointer}
.dlg-body{padding:8px 22px 22px;max-height:70vh;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--surface)}
td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.tbl-scroll{overflow-x:auto}

.mv{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.mv section{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px 18px}
.mv h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.mv .badge{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.mv ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.mv li{font-size:13.5px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mv .empty{color:var(--muted);font-size:13.5px}

.buy-note{font-size:13.5px;color:var(--muted);max-width:78ch;margin:0 0 20px}
.buy-list{display:grid;gap:12px}
.buy{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 16px}
.buy .rank{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;color:var(--muted);text-align:center}
.buy .name{font-size:14.5px;font-weight:700}
.buy .why{font-size:12.5px;color:var(--muted);margin-top:3px}
.buy .right{text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.scorebar{width:120px;height:5px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.scorebar i{display:block;height:100%;background:var(--accent)}
.buy .price{font-size:17px}
.hit{background:var(--ok-soft);border:1px solid var(--ok);border-radius:13px;padding:14px 18px;margin-bottom:20px}
.hit h3{margin:0 0 8px;font-size:15px;color:var(--ok)}
.hit ul{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:13.5px}
.hit li{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wl{margin-top:26px}
.wl h3{font-size:15px;margin:0 0 10px}
.tgt{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.tgt .row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.tgt input{font:inherit;font-size:13px;padding:7px 9px;border-radius:8px;width:130px;
  border:1px solid var(--line);background:var(--ground);color:var(--ink)}
.tgt label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
@media (max-width:600px){.buy{grid-template-columns:34px 1fr}.buy .right{grid-column:2;align-items:flex-start;text-align:left}}
.hist-pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:18px}
.chart svg{width:100%;height:300px;display:block}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:2px;background:currentColor;vertical-align:middle;margin-right:5px}

footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
footer .shops{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
footer .s{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:3px 8px;border-radius:6px;background:var(--surface-2)}
footer .s.bad{background:var(--crit-soft);color:var(--crit)}
.hidden{display:none!important}
@media (max-width:600px){h1{font-size:22px}.wrap{padding:0 14px 60px}}
</style>
</head>
<body>
<div id="stale" class="stale hidden"></div>
<div class="wrap">
  <header>
    <div>
      <h1>Cenová mapa Pokémon TCG</h1>
      <div class="sub" id="subtitle">načítavam…</div>
    </div>
    <div class="head-right">
    <button class="btn scan" id="scan-now" title="Spustí rovnaký sken ako každý večer o 19:00">Spustiť sken</button>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-today" aria-selected="true">Dnes</button>
      <button class="tab" role="tab" id="tab-buy" aria-selected="false">Kúpiť dnes</button>
      <button class="tab" role="tab" id="tab-moves" aria-selected="false">Pohyby</button>
      <button class="tab" role="tab" id="tab-hist" aria-selected="false">História</button>
      <button class="tab" role="tab" id="tab-port" aria-selected="false">Portfólio</button>
    </div>
    </div>
    <div class="scan-msg" id="scan-msg"></div>
  </header>

  <div id="view-today">
    <div class="bar">
      <input id="q" type="search" placeholder="hľadať edíciu alebo produkt…" aria-label="Hľadať">
      <span class="sep"></span>
      <button class="f" data-series="ME" aria-pressed="false">Mega Evolution</button>
      <button class="f" data-series="SV" aria-pressed="false">Scarlet &amp; Violet</button>
      <button class="f" data-series="SWSH" aria-pressed="false">Sword &amp; Shield</button>
      <button class="f" data-series="OLD" aria-pressed="false" title="Sun &amp; Moon, XY a klasika">Staršie</button>
      <span class="sep"></span>
      <button class="f" data-fmt="booster" aria-pressed="false">Booster</button>
      <button class="f" data-fmt="bundle" aria-pressed="false">Bundle</button>
      <button class="f" data-fmt="booster-box" aria-pressed="false">Box</button>
      <button class="f" data-fmt="etb" aria-pressed="false">ETB</button>
      <button class="f" data-fmt="ultra-premium" aria-pressed="false">UPC</button>
      <span class="sep"></span>
      <button class="f" id="only-stock" aria-pressed="false">len skladom</button>
      <button class="f" id="only-tier" aria-pressed="false">len úroveň A/B</button>
      <span class="spacer"></span>
      <span class="count" id="count"></span>
    </div>
    <div class="cards" id="cards"></div>
  </div>

  <div id="view-buy" class="hidden"></div>

  <div id="view-moves" class="hidden"></div>

  <div id="view-hist" class="hidden">
    <div class="hist-pick" id="hist-pick"></div>
    <div class="chart" id="chart"></div>
  </div>

  <div id="view-port" class="hidden"></div>

  <footer id="footer"></footer>
</div>

<dialog id="detail">
  <div class="dlg-head">
    <div><h2 id="d-title"></h2><div class="sub" id="d-sub"></div></div>
    <button class="close" id="d-close">Zavrieť</button>
  </div>
  <div class="dlg-body">
    <div class="tbl-scroll"><table id="d-table"></table></div>
    <div class="tgt" id="d-target"></div>
    <p class="sub" style="margin-top:14px">Kľúč do portfólia: <code id="d-key" class="mono"></code></p>
  </div>
</dialog>

<script>
const state = {data:null, formats:new Set(), series:new Set(), q:"",
               onlyStock:false, onlyTier:false, view:'today', histKey:null};

const eur = v => v==null ? '—'
  : v.toLocaleString('sk-SK',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const el = (t,c,txt) => { const n=document.createElement(t); if(c)n.className=c; if(txt!=null)n.textContent=txt; return n; };
const shopName = id => (state.data.shops.find(s=>s.id===id)||{}).name || id;

function sparkline(points){
  if(!points || points.length < 2) return '';
  const vs = points.map(p=>p.v), min=Math.min(...vs), max=Math.max(...vs), span=(max-min)||1;
  const step = 100/(points.length-1);
  const coords = points.map((p,i)=>`${(i*step).toFixed(1)},${(24-((p.v-min)/span)*20).toFixed(1)}`);
  const last = coords[coords.length-1].split(',');
  return `<svg class="spark" viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${coords.join(' ')}" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".55"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.2" fill="currentColor"/></svg>`;
}

/* Chip „Staršie" zastupuje tri série naraz, nech sa lišta nerozrastie do šírky. */
const OLD_SERIES = ['SM', 'XY', 'vintage'];
function matchesSeries(series){
  if(state.series.has(series)) return true;
  return state.series.has('OLD') && OLD_SERIES.includes(series);
}

function visibleProducts(){
  const q = state.q.trim().toLowerCase();
  return state.data.products.filter(p=>{
    if(state.onlyTier && !['A','B'].includes(p.edition.tier)) return false;
    if(state.series.size && !matchesSeries(p.edition.series)) return false;
    if(state.formats.size && !state.formats.has(p.format.id)) return false;
    if(state.onlyStock && p.in_stock_count === 0) return false;
    if(q){
      const hay = `${p.title} ${p.edition.name} ${p.edition.code} ${p.format.name}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

/* Najnižšia cena skladom je zároveň historickým minimom? Tolerancia 1 %,
   aby drobné pohyby kurzu nezhasínali značku každý druhý deň.
   Pod 14 dní histórie je to pravda skoro vždy, tak sa značka nezobrazuje. */
const MIN_HISTORY_DAYS = 14;
function atHistoricLow(p){
  return p.min_eur != null && p.low_eur != null &&
         p.history.length >= MIN_HISTORY_DAYS && p.min_eur <= p.low_eur * 1.01;
}

function renderCards(){
  const box = document.getElementById('cards');
  box.innerHTML = '';
  const items = visibleProducts();
  document.getElementById('count').textContent =
    `${items.length} z ${state.data.products.length} produktov · ${items.reduce((a,p)=>a+p.offer_count,0)} ponúk`;
  for(const p of items){
    const card = el('button','card');
    card.type = 'button';
    const flag = (p.offers.find(o=>o.in_stock && o.flag)||{}).flag || '';
    const delta = p.min_delta_pct;
    const bits = [p.edition.code || '—'];
    if(p.packs) bits.push(`${p.packs} ${p.packs===1?'balíček':'balíčkov'}`);
    bits.push(`${p.offer_count} ponúk`);
    card.innerHTML = `
      <div class="thumb">
        ${p.edition.tier ? `<span class="tier ${p.edition.tier}">${p.edition.tier}</span>` : ''}
        <span class="ph">bez obrázka</span>
        ${p.image ? `<img src="${p.image}" alt="" loading="lazy" onerror="this.remove()">` : ''}
      </div>
      <div class="cbody">
        <div class="ctitle">${p.title}</div>
        <div class="csub">${bits.join(' · ')}</div>
        ${sparkline(p.history)}
        ${p.in_stock_count
          ? `<span class="pill ok">skladom v ${p.in_stock_count} eshopoch</span>`
          : '<span class="pill no">nikde skladom</span>'}
        ${flag ? `<span class="pill flag">${flag}</span>` : ''}
        ${atHistoricLow(p) ? '<span class="pill low">najnižšie doteraz</span>' : ''}
        ${p.vs_launch_pct!=null && p.vs_launch_pct<=-3
          ? `<span class="pill ok">${Math.abs(p.vs_launch_pct).toFixed(0)} % pod uvádzacou</span>` : ''}
        ${p.in_print===false ? '<span class="pill eol">po ukončení tlače</span>' : ''}
        <div class="prow">
          <span class="price"${p.min_eur==null?' style="color:var(--muted)"':''}>${eur(p.min_eur!=null?p.min_eur:p.min_any_eur)}</span>
          ${p.min_per_pack_eur!=null
            ? `<span class="pp">${eur(p.min_per_pack_eur)} / balíček</span>`
            : (p.min_eur==null ? '<span class="pp">najlacnejšia ponuka, nie je skladom</span>' : '')}
          ${delta!=null&&delta!==0?`<span class="delta ${delta<0?'dn':'up'}">${delta>0?'+':''}${delta} %</span>`:''}
        </div>
      </div>`;
    card.addEventListener('click', ()=>openDetail(p));
    box.appendChild(card);
  }
  if(!items.length) box.innerHTML = '<p class="count">Nič nezodpovedá filtru.</p>';
}

function openDetail(p){
  document.getElementById('d-title').textContent = p.title;
  const sub = [p.edition.code || '—'];
  if(p.edition.tier) sub.push(`úroveň ${p.edition.tier}`);
  if(p.packs) sub.push(`${p.packs} balíčkov`);
  sub.push(p.median_trusted
    ? `medián skladom ${eur(p.median_eur)} (${p.sellers_in_stock} predajcov)`
    : (p.sellers_in_stock
        ? `${p.sellers_in_stock === 1 ? 'jediná ponuka' : '2 ponuky'} — na medián málo`
        : 'nikde skladom'));
  if(p.low_eur!=null && p.history.length>=MIN_HISTORY_DAYS) sub.push(`historicky ${eur(p.low_eur)} – ${eur(p.high_eur)}`);
  if(p.launch_eur) sub.push(`uvádzacia ${eur(p.launch_eur)}${p.vs_launch_pct!=null?` (${p.vs_launch_pct>0?'+':''}${p.vs_launch_pct} %)`:''}`);
  if(p.released){
    const d = p.days_since_release;
    const when = d==null ? '' : (d < 0 ? `, vyjde o ${-d} dní` : `, pred ${d} dňami`);
    sub.push(`${d!=null && d<0 ? 'vydanie' : 'vydané'} ${p.released}${when}${p.in_print===false?' — po ukončení tlače':''}`);
  }
  document.getElementById('d-sub').textContent = sub.join(' · ');
  const rows = p.offers.map(o=>`
    <tr>
      <td>${shopName(o.shop_id)}</td>
      <td class="n">${o.price.toLocaleString('sk-SK')} ${o.currency}</td>
      <td class="n">${eur(o.price_eur)}</td>
      <td class="n">${o.per_pack_eur!=null?eur(o.per_pack_eur):'—'}</td>
      <td>${o.in_stock?'<span class="pill ok">skladom</span>':'<span class="pill no">nie je</span>'}
        ${o.stock_text?`<div class="csub" style="margin-top:3px">${o.stock_text}</div>`:''}</td>
      <td class="n">${o.delta_pct!=null&&o.delta_pct!==0?`<span class="delta ${o.delta_pct<0?'dn':'up'}">${o.delta_pct>0?'+':''}${o.delta_pct} %</span>`:'—'}</td>
      <td>${o.flag?`<span class="pill flag">${o.flag}</span>`:''}${o.outlier?' <span class="pill no">skok ceny</span>':''}</td>
      <td><a href="${o.url}" target="_blank" rel="noopener">otvoriť</a></td>
    </tr>`).join('');
  document.getElementById('d-table').innerHTML =
    `<thead><tr><th>Eshop</th><th>Cena</th><th>V €</th><th>Za balíček</th><th>Dostupnosť</th><th>Zmena</th><th>Značky</th><th></th></tr></thead><tbody>${rows}</tbody>`;
  document.getElementById('d-key').textContent = p.key;
  renderTargetForm(p);
  document.getElementById('detail').showModal();
}

function renderHistory(){
  const products = state.data.products.filter(p=>p.history.length>1);
  if(!products.length){ document.getElementById('chart').innerHTML =
    '<p class="count">História sa začne plniť po druhom dennom behu.</p>'; return; }
  if(!state.histKey || !products.find(p=>p.key===state.histKey)) state.histKey = products[0].key;
  const pick = document.getElementById('hist-pick');
  pick.innerHTML = '';
  for(const p of products.slice(0,60)){
    const b = el('button','f', p.title);
    b.setAttribute('aria-pressed', String(p.key===state.histKey));
    b.addEventListener('click', ()=>{ state.histKey = p.key; renderHistory(); });
    pick.appendChild(b);
  }
  const p = products.find(x=>x.key===state.histKey);
  const pts = p.history, vs = pts.map(x=>x.v);
  const min = Math.min(...vs), max = Math.max(...vs), span=(max-min)||1;
  const W=1000, H=300, pad={l:58,r:14,t:16,b:28};
  const x = i => pad.l + i*((W-pad.l-pad.r)/Math.max(1,pts.length-1));
  const y = v => pad.t + (1-(v-min)/span)*(H-pad.t-pad.b);
  const line = pts.map((q,i)=>`${x(i).toFixed(1)},${y(q.v).toFixed(1)}`).join(' ');
  const area = `${pad.l},${H-pad.b} ${line} ${x(pts.length-1).toFixed(1)},${H-pad.b}`;
  const ticks = [min, min+span/2, max];
  document.getElementById('chart').innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vývoj najnižšej ceny skladom">
      ${ticks.map(t=>`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(t)}" y2="${y(t)}" stroke="currentColor" opacity=".12"/>
         <text x="${pad.l-10}" y="${y(t)+4}" text-anchor="end" font-size="12" fill="currentColor" opacity=".55"
           font-family="IBM Plex Mono, monospace">${t.toFixed(0)} €</text>`).join('')}
      <polygon points="${area}" fill="currentColor" opacity=".08"/>
      <polyline points="${line}" fill="none" stroke="currentColor" stroke-width="2.5" opacity=".8"/>
      <circle cx="${x(pts.length-1)}" cy="${y(pts[pts.length-1].v)}" r="4" fill="currentColor"/>
      <text x="${pad.l}" y="${H-8}" font-size="12" fill="currentColor" opacity=".55"
        font-family="IBM Plex Mono, monospace">${pts[0].d}</text>
      <text x="${W-pad.r}" y="${H-8}" text-anchor="end" font-size="12" fill="currentColor" opacity=".55"
        font-family="IBM Plex Mono, monospace">${pts[pts.length-1].d}</text>
    </svg>
    <div class="legend"><span><i></i> najnižšia cena skladom · ${p.title}</span></div>`;
}

const PKEY = 'cenova-mapa-portfolio-token';
let holdings = null;          // lokálna kópia, kým sa neuloží
let portMsg = '';

const endpoint = () => (state.data.portfolio_endpoint || '').replace(/\/$/, '');
const token = () => { try { return localStorage.getItem(PKEY) || ''; } catch { return ''; } };

async function portfolioApi(method, body, store='portfolio'){
  const url = `${endpoint()}?${store}=1&t=${encodeURIComponent(token())}`;
  const res = await fetch(url, {
    method,
    headers: body ? {'content-type':'application/json'} : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if(res.status === 401) throw new Error('Nesprávne heslo portfólia.');
  if(!res.ok) throw new Error(`Worker odpovedal ${res.status}.`);
  return res.json();
}

async function loadHoldings(){
  const data = await portfolioApi('GET');
  holdings = (data.holdings || []).map(h => ({...h}));
}

async function saveHoldings(){
  await portfolioApi('POST', {holdings});
  portMsg = 'Uložené. Ocenenie sa prepočíta hneď, do histórie sa zapíše pri najbližšom skene.';
}

function renderTargetForm(p){
  const box = document.getElementById('d-target');
  if(!endpoint()){ box.innerHTML = ''; return; }
  if(!token()){
    box.innerHTML = '<p class="sub">Cieľovú cenu vieš nastaviť po odomknutí portfólia.</p>';
    return;
  }
  if(targets === null){
    box.innerHTML = '<p class="sub">načítavam cieľové ceny…</p>';
    loadTargets().then(()=>renderTargetForm(p))
      .catch(err=>{ box.innerHTML = `<p class="pmsg err">${err.message}</p>`; });
    return;
  }
  const current = targets.find(t=>t.key === p.key);
  const gap = (current && p.min_eur!=null)
    ? ((p.min_eur - current.target) / current.target * 100) : null;
  box.innerHTML = `
    <div class="row">
      <div><label for="t-val">Cieľová cena (€)</label>
        <input id="t-val" type="number" min="0" step="0.5" placeholder="napr. 129"
          value="${current ? current.target : ''}"></div>
      <button class="btn" id="t-save">Uložiť cieľ</button>
      ${current ? '<button class="btn ghost" id="t-del">Zrušiť cieľ</button>' : ''}
      <span class="pmsg" id="t-msg" style="margin:0 0 6px">${
        current
          ? (p.min_eur==null ? 'Zatiaľ nikde skladom.'
             : (gap<=0 ? 'Cieľ je splnený už teraz.'
                       : `Najlacnejšie teraz ${eur(p.min_eur)} — ${gap.toFixed(1)} % nad cieľom.`))
          : 'Keď cena klesne na tvoju hranicu, produkt sa objaví v Kúpiť dnes.'}</span>
    </div>`;

  document.getElementById('t-save').addEventListener('click', async ()=>{
    const value = parseFloat(document.getElementById('t-val').value);
    const msg = document.getElementById('t-msg');
    if(!(value > 0)){ msg.className = 'pmsg err'; msg.textContent = 'Zadaj cenu väčšiu než nula.'; return; }
    targets = targets.filter(t=>t.key !== p.key);
    targets.push({key: p.key, title: p.title, target: value});
    try { await saveTargets(); renderTargetForm(p); }
    catch(err){ msg.className = 'pmsg err'; msg.textContent = err.message; }
  });
  const del = document.getElementById('t-del');
  if(del) del.addEventListener('click', async ()=>{
    targets = targets.filter(t=>t.key !== p.key);
    try { await saveTargets(); renderTargetForm(p); }
    catch(err){ document.getElementById('t-msg').textContent = err.message; }
  });
}

/* Ocenenie počítame v prehliadači z čerstvo načítaných cien — netreba čakať
   na nočný beh, aby si po pridaní položky videl, ako si nakúpil. */
function evaluate(h){
  const product = state.data.products.find(p => p.key === h.key);
  const rate = state.data.fx.czk_per_eur || 24.1;
  const unitCost = h.currency === 'CZK' ? h.price / rate : h.price;
  const basis = state.data.portfolio.basis === 'min' ? 'min_eur' : 'median_eur';
  const unitValue = product ? (product[basis] ?? product.min_eur ?? product.min_any_eur) : null;
  const market = product ? product.min_eur : null;
  return {
    product, unitCost,
    cost: unitCost * h.qty,
    unitValue,
    value: unitValue != null ? unitValue * h.qty : null,
    pl: unitValue != null ? (unitValue - unitCost) * h.qty : null,
    plPct: unitValue != null && unitCost ? (unitValue - unitCost) / unitCost * 100 : null,
    market,
    vsMarket: market ? (unitCost - market) / market * 100 : null,
  };
}

/* Graf hodnoty portfólia: plná čiara je dnešná hodnota, čiarkovaná to, čo si
   za to zaplatil. Body pribúdajú po jednom za každý sken. */
function portfolioChart(points){
  if(!points || points.length < 2){
    return `<p class="count" style="margin-bottom:22px">Graf sa nakreslí po druhom skene —
      zatiaľ je ${points && points.length ? 'jeden bod' : 'prázdny'}.</p>`;
  }
  const vals = points.flatMap(p=>[p.value, p.cost]).filter(v=>v!=null);
  const min = Math.min(...vals), max = Math.max(...vals);
  const lo = min - (max-min || max*0.1 || 1)*0.12, hi = max + (max-min || max*0.1 || 1)*0.12;
  const span = (hi-lo) || 1;
  const W=1000, H=230, pad={l:66,r:14,t:14,b:26};
  const x = i => pad.l + i*((W-pad.l-pad.r)/Math.max(1,points.length-1));
  const y = v => pad.t + (1-(v-lo)/span)*(H-pad.t-pad.b);
  const path = key => points.map((p,i)=>`${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join(' ');
  const last = points[points.length-1];
  const ticks = [lo+span*0.1, lo+span*0.5, lo+span*0.9];
  const pl = last.value - last.cost;
  return `<div class="chart" style="margin-bottom:22px">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vývoj hodnoty portfólia">
      ${ticks.map(t=>`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(t)}" y2="${y(t)}" stroke="currentColor" opacity=".12"/>
        <text x="${pad.l-10}" y="${y(t)+4}" text-anchor="end" font-size="12" fill="currentColor" opacity=".55"
          font-family="IBM Plex Mono, monospace">${t.toFixed(0)} €</text>`).join('')}
      <polyline points="${path('cost')}" fill="none" stroke="currentColor" stroke-width="2"
        stroke-dasharray="6 5" opacity=".45"/>
      <polyline points="${path('value')}" fill="none" stroke="currentColor" stroke-width="2.5"
        opacity=".85" style="color:var(--accent)" stroke-linejoin="round"/>
      <circle cx="${x(points.length-1)}" cy="${y(last.value)}" r="4" fill="currentColor"/>
      <text x="${pad.l}" y="${H-7}" font-size="12" fill="currentColor" opacity=".55"
        font-family="IBM Plex Mono, monospace">${points[0].d}</text>
      <text x="${W-pad.r}" y="${H-7}" text-anchor="end" font-size="12" fill="currentColor" opacity=".55"
        font-family="IBM Plex Mono, monospace">${last.d}</text>
    </svg>
    <div class="legend">
      <span><i></i> hodnota ${eur(last.value)}</span>
      <span style="opacity:.6"><i style="border-top:2px dashed currentColor;background:none;height:0"></i> náklady ${eur(last.cost)}</span>
      <span class="${pl>0?'gain':(pl<0?'loss':'')}">rozdiel ${pl>0?'+':''}${eur(pl)}</span>
    </div></div>`;
}

/* Keď Worker nie je nastavený, portfólio sa vedie v config/portfolio.yaml —
   zapisovať sa tu nedá, ale prehľad a graf majú zmysel aj tak. */
function readOnlyPortfolio(port){
  const t = port.totals;
  const cls = v => v>0 ? 'gain' : (v<0 ? 'loss' : '');
  const sign = v => v>0 ? '+' : '';
  const rows = port.items.map(i=>`<tr>
    <td>${i.found ? i.title : `<span class="loss">${i.title} — nenájdené</span>`}</td>
    <td class="n">${i.qty}</td>
    <td class="n">${i.price.toLocaleString('sk-SK')} ${i.currency}</td>
    <td class="n">${eur(i.cost_eur)}</td>
    <td class="n">${i.market_min_eur!=null?eur(i.market_min_eur):'—'}</td>
    <td class="n">${i.vs_market_pct!=null?`<b class="${i.vs_market_pct<0?'gain':'loss'}">${sign(i.vs_market_pct)}${i.vs_market_pct} %</b>`:'—'}</td>
    <td class="n">${i.value_eur!=null?eur(i.value_eur):'—'}</td>
    <td class="n"><b class="${cls(i.pl_eur)}">${i.pl_eur!=null?sign(i.pl_eur)+eur(i.pl_eur):'—'}</b></td>
    <td>${i.shop||''}</td><td>${i.bought||''}</td></tr>`).join('');
  return portfolioChart(state.data.portfolio_history) + `
    <div class="port-sum">
      <div><div class="lbl">Nakúpené za</div><div class="val">${eur(t.cost_eur)}</div></div>
      <div><div class="lbl">Aktuálna hodnota</div><div class="val">${eur(t.value_eur)}</div></div>
      <div><div class="lbl">Rozdiel</div><div class="val ${cls(t.pl_eur)}">${sign(t.pl_eur)}${eur(t.pl_eur)}</div></div>
      <div><div class="lbl">Zhodnotenie</div><div class="val ${cls(t.pl_pct)}">${t.pl_pct!=null?sign(t.pl_pct)+t.pl_pct+' %':'—'}</div></div>
    </div>
    <div class="tbl-scroll"><table>
      <thead><tr><th>Produkt</th><th>Ks</th><th>Nákup / ks</th><th>Náklady</th>
        <th>Najlacnejšie teraz</th><th>Nákup vs trh</th><th>Hodnota</th><th>Rozdiel</th>
        <th>Obchod</th><th>Kúpené</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
}

function renderPortfolio(){
  const box = document.getElementById('view-port');

  if(!endpoint()){

    box.innerHTML = `<div class="port-empty unlock"><h3>Portfólio je zamknuté</h3>

      Uloží sa len v tomto prehliadači, nikam sa neposiela okrem tvojho Workera.</p>
      <div class="row"><input id="tok" type="password" placeholder="heslo portfólia"

    const go = async () => {

        <p class="pmsg err">${err.message}</p>

  const rows = holdings.map((h,i) => {
    const e = evaluate(h);
    const cls = v => v>0 ? 'gain' : (v<0 ? 'loss' : '');
    const sign = v => v>0 ? '+' : '';
    return `<tr>
      <td>${e.product ? e.product.title : `<span class="loss">${h.title || h.key} — nenájdené</span>`}</td>
      <td class="n">${h.qty}</td>
      <td class="n">${h.price.toLocaleString('sk-SK')} ${h.currency}</td>
      <td class="n">${eur(e.cost)}</td>
      <td class="n">${e.market!=null?eur(e.market):'—'}</td>
      <td class="n">${e.vsMarket!=null
        ? `<b class="${e.vsMarket<0?'gain':'loss'}">${sign(e.vsMarket)}${e.vsMarket.toFixed(1)} %</b>`
        : '—'}</td>
      <td class="n">${e.value!=null?eur(e.value):'—'}</td>
      <td class="n"><b class="${cls(e.pl)}">${e.pl!=null?sign(e.pl)+eur(e.pl):'—'}</b></td>
      <td class="n"><b class="${cls(e.plPct)}">${e.plPct!=null?sign(e.plPct)+e.plPct.toFixed(1)+' %':'—'}</b></td>
      <td>${h.shop||''}</td><td>${h.bought||''}</td>
      <td><button class="btn ghost" data-del="${i}" title="Odstrániť">×</button></td>
    </tr>`;
  }).join('');

  const totals = holdings.reduce((acc,h) => {
    const e = evaluate(h);
    acc.cost += e.cost; if(e.value!=null) acc.value += e.value; return acc;
  }, {cost:0, value:0});
  const pl = totals.value - totals.cost;
  const plPct = totals.cost ? pl / totals.cost * 100 : null;
  const cls = v => v>0 ? 'gain' : (v<0 ? 'loss' : '');
  const sign = v => v>0 ? '+' : '';

  const options = state.data.products.map(p =>
    `<option value="${p.title.replace(/"/g,'&quot;')}" data-key="${p.key}">`).join('');

  box.innerHTML = `
    <div class="pform">
      <h3>Pridať nákup</h3>
      <div class="grid">
        <div><label for="f-name">Produkt</label>
          <input id="f-name" list="plist" placeholder="začni písať názov edície…" autocomplete="off">
          <datalist id="plist">${options}</datalist></div>
        <div><label for="f-qty">Ks</label><input id="f-qty" type="number" min="1" step="1" value="1"></div>
        <div><label for="f-price">Cena / ks</label><input id="f-price" type="number" min="0" step="0.01" placeholder="0.00"></div>
        <div><label for="f-cur">Mena</label><select id="f-cur"><option>EUR</option><option>CZK</option></select></div>
        <div><label for="f-shop">Obchod</label><input id="f-shop" placeholder="napr. Cardyx.sk"></div>
        <div><label for="f-date">Kúpené</label><input id="f-date" type="date"></div>
        <div><button class="btn" id="f-add">Pridať</button></div>
      </div>
      <p class="pmsg ${portMsg.startsWith('Chyba')?'err':'ok'}" id="p-msg">${portMsg}</p>
    </div>

    ${holdings.length ? `
    ${portfolioChart(state.data.portfolio_history)}
    <div class="port-sum">
      <div><div class="lbl">Nakúpené za</div><div class="val">${eur(totals.cost)}</div></div>
      <div><div class="lbl">Aktuálna hodnota</div><div class="val">${eur(totals.value)}</div></div>
      <div><div class="lbl">Rozdiel</div><div class="val ${cls(pl)}">${sign(pl)}${eur(pl)}</div></div>
      <div><div class="lbl">Zhodnotenie</div><div class="val ${cls(plPct)}">${plPct!=null?sign(plPct)+plPct.toFixed(1)+' %':'—'}</div></div>
    </div>
    <div class="tbl-scroll"><table>
      <thead><tr><th>Produkt</th><th>Ks</th><th>Nákup / ks</th><th>Náklady</th>
        <th>Najlacnejšie teraz</th><th>Nákup vs trh</th><th>Hodnota</th><th>Rozdiel</th><th>%</th>
        <th>Obchod</th><th>Kúpené</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="sub" style="margin-top:14px;max-width:74ch">
      <b>Nákup vs trh</b> porovnáva tvoju nákupnú cenu s najlacnejšou ponukou skladom dnes —
      zelené číslo znamená, že si vtedy kúpil lacnejšie, než sa dá kúpiť teraz.
      <b>Hodnota</b> sa počíta ${state.data.portfolio.basis==='min'?'najlacnejšou ponukou':'mediánom ponúk skladom'};
      je to cena, za ktorú sa produkt <em>ponúka</em>, nie za ktorú ho vieš predať.
    </p>` : '<p class="count">Zatiaľ nič — pridaj prvý nákup hore.</p>'}`;

  document.getElementById('f-add').addEventListener('click', addHolding);
  box.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      holdings.splice(Number(btn.dataset.del), 1);
      try { await saveHoldings(); } catch(err){ portMsg = 'Chyba: ' + err.message; }
      renderPortfolio();
    });
  });
}

async function addHolding(){
  const name = document.getElementById('f-name').value.trim();
  const price = parseFloat(document.getElementById('f-price').value);
  const qty = parseInt(document.getElementById('f-qty').value, 10) || 1;
  const msg = document.getElementById('p-msg');
  const product = state.data.products.find(p => p.title === name);

  if(!name || !price){ msg.className = 'pmsg err'; msg.textContent = 'Vyplň produkt a cenu.'; return; }
  if(!product){
    msg.className = 'pmsg err';
    msg.textContent = 'Taký produkt v zozname nie je — vyber ho z ponuky, aby sa dal oceniť.';
    return;
  }
  holdings.push({
    id: String(Date.now()),
    key: product.key,
    title: product.title,
    qty, price,
    currency: document.getElementById('f-cur').value,
    shop: document.getElementById('f-shop').value.trim(),
    bought: document.getElementById('f-date').value,
    note: '',
  });
  try { await saveHoldings(); }
  catch(err){ portMsg = 'Chyba: ' + err.message; }
  renderPortfolio();
}

function renderFooter(){
  const d = state.data;
  const shops = d.shops.map(s=>`<span class="s ${s.ok?'':'bad'}">${s.name}${s.ok?` ${s.count}`:' — nedostupný'}</span>`).join('');
  document.getElementById('footer').innerHTML = `
    <div>Posledný sken ${new Date(d.generated_at).toLocaleString('sk-SK')} ·
      kurz ${d.fx.czk_per_eur} Kč/€${d.fx.stale?' (starý kurz)':''} ·
      ${d.counts.offers} ponúk, ${d.counts.products} produktov</div>
    <div class="shops">${shops}</div>
    <div><b>„Najlacnejšie" znamená najlacnejšie z ${d.shops.length} sledovaných eshopov, nie z celého trhu.</b>
      Na CZ/SK predáva zapečatené Pokémon produkty aj ďalších zhruba desať obchodov, ktoré appka nepozná — pred väčším
      nákupom sa oplatí pozrieť aj mimo nej.</div>
    <div style="margin-top:6px">Značka <b>pod trhom</b> = 5–30 % pod mediánom ponúk skladom; počíta sa až od
      ${d.counts.min_sellers_for_median || 3} rôznych predajcov, pri menšom počte je to cena predajcu, nie trhu.
      <b>overiť</b> = viac než 30 % pod mediánom, skoro vždy chyba eshopu.
      Ceny zberateľských kariet sú špekulatívne — toto nie je investičné poradenstvo.</div>`;
}

function setView(name){
  state.view = name;
  const map = [['tab-today','view-today'],['tab-buy','view-buy'],['tab-moves','view-moves'],
               ['tab-hist','view-hist'],['tab-port','view-port']];
  for(const [id,view] of map){
    const active = id === 'tab-'+name;
    document.getElementById(id).setAttribute('aria-selected', String(active));
    document.getElementById(view).classList.toggle('hidden', !active);
  }
  if(name==='buy') renderBuy();
  if(name==='moves') renderMoves();
  if(name==='hist') renderHistory();
  if(name==='port') renderPortfolio();
}

function boot(data){
  state.data = data;
  document.getElementById('subtitle').textContent =
    `${data.date} · ${data.shops.filter(s=>s.ok).length} z ${data.shops.length} eshopov · ` +
    `${data.counts.products} produktov od klasiky po Mega Evolution`;
  const today = new Date().toISOString().slice(0,10);
  if(data.date !== today){
    const bar = document.getElementById('stale');
    bar.textContent = `Pozor: dáta sú z ${data.date}, dnes je ${today}. Denný sken zrejme neprebehol.`;
    bar.classList.remove('hidden');
  }
  renderCards(); renderFooter();
}

document.querySelectorAll('.f[data-fmt]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const id = btn.dataset.fmt;
    state.formats.has(id) ? state.formats.delete(id) : state.formats.add(id);
    btn.setAttribute('aria-pressed', String(state.formats.has(id)));
    renderCards();
  });
});
document.querySelectorAll('.f[data-series]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const id = btn.dataset.series;
    state.series.has(id) ? state.series.delete(id) : state.series.add(id);
    btn.setAttribute('aria-pressed', String(state.series.has(id)));
    renderCards();
  });
});
for(const [id,key] of [['only-stock','onlyStock'],['only-tier','onlyTier']]){
  document.getElementById(id).addEventListener('click', e=>{
    state[key] = !state[key];
    e.currentTarget.setAttribute('aria-pressed', String(state[key]));
    renderCards();
  });
}
document.getElementById('q').addEventListener('input', e=>{
  state.q = e.target.value; renderCards();
});
/* Ručný sken: stránka nesmie poznať GitHub token, tak dispatch robí Worker.
   Overuje sa tým istým heslom ako portfólio. */
let scanPoll = null;
async function runScan(){
  const btn = document.getElementById('scan-now');
  const msg = document.getElementById('scan-msg');
  if(!endpoint()){ msg.className='scan-msg err'; msg.textContent='Chýba adresa Workera.'; return; }
  if(!token()){
    msg.className='scan-msg err';
    msg.textContent='Najprv odomkni heslo v záložke Portfólio.';
    setView('port'); return;
  }
  btn.disabled = true;
  msg.className='scan-msg'; msg.textContent='spúšťam…';
  try{
    const res = await fetch(`${endpoint()}?scan=1&t=${encodeURIComponent(token())}`, {method:'POST'});
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error || `Worker odpovedal ${res.status}`);
  }catch(err){
    btn.disabled = false;
    msg.className='scan-msg err'; msg.textContent = err.message;
    return;
  }

  const started = state.data.generated_at;
  let waited = 0;
  msg.textContent = 'sken beží, trvá 2–5 minút — stránka sa obnoví sama';
  clearInterval(scanPoll);
  scanPoll = setInterval(async ()=>{
    waited += 20;
    try{
      const fresh = await (await fetch('latest.json?v=' + Date.now())).json();
      if(fresh.generated_at !== started){ clearInterval(scanPoll); location.reload(); return; }
    }catch{}
    if(waited >= 600){
      clearInterval(scanPoll);
      btn.disabled = false;
      msg.textContent = 'sken stále beží alebo skončil chybou — pozri Actions na GitHube';
    }else{
      msg.textContent = `sken beží… ${waited} s`;
    }
  }, 20000);
}
document.getElementById('scan-now').addEventListener('click', runScan);
document.getElementById('tab-today').addEventListener('click', ()=>setView('today'));
document.getElementById('tab-buy').addEventListener('click', ()=>setView('buy'));
document.getElementById('tab-moves').addEventListener('click', ()=>setView('moves'));
document.getElementById('tab-hist').addEventListener('click', ()=>setView('hist'));
document.getElementById('tab-port').addEventListener('click', ()=>setView('port'));
document.getElementById('d-close').addEventListener('click', ()=>document.getElementById('detail').close());

fetch('latest.json?v=' + Date.now())
  .then(r=>r.json()).then(boot)
  .catch(()=>{ document.getElementById('subtitle').textContent =
    'latest.json sa nepodarilo načítať — prebehol už denný sken?'; });
</script>
