name: Denný sken cien

on:
  schedule:
    # 17:00 UTC = 19:00 letný čas / 18:00 zimný čas.
    # V zime prepni na "0 18 * * *", ak chceš držať 19:00 miestneho času.
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      snapshots:
        description: "Uložiť stiahnuté stránky ako artefakt (na obnovu fixtures)"
        type: boolean
        default: false
      force:
        description: "Zapísať dáta aj keď poistky hlásia problém"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Inštalácia závislostí
        run: pip install -r requirements.txt

      - name: Testy parserov
        run: python -m pytest tests -q

      - name: Sken eshopov
        env:
          SCRAPE_PROXY_URL: ${{ secrets.SCRAPE_PROXY_URL }}
          SCRAPE_PROXY_TOKEN: ${{ secrets.SCRAPE_PROXY_TOKEN }}
          SCRAPE_PORTFOLIO_TOKEN: ${{ secrets.SCRAPE_PORTFOLIO_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/scrape.py \
            ${{ inputs.snapshots && '--snapshots snapshots' || '' }} \
            ${{ inputs.force && '--force' || '' }}

      - name: Obrázky balení
        run: python src/images.py

      - name: Commit dát
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "Bez zmien."
          else
            git commit -m "Sken $(date -u +%Y-%m-%d)"
            # Keby si medzitým niečo pushol z počítača, push by spadol.
            # Skúsime ho ešte raz po dotiahnutí cudzích zmien.
            git push || { git pull --rebase && git push; }
          fi

      - name: Stiahnuté stránky ako artefakt
        if: ${{ always() && inputs.snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots/
          retention-days: 7
