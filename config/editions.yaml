    patterns: ["(accessory\\s+)?pouch"]

  - id: blister-3
    name: 3-Blister
    short: 3× Blister
    packs: 3
    patterns: ["3\\s*blister", "triple\\s+blister"]

  - id: blister-1
    name: Blister
    short: Blister
    packs: 1
    patterns: ["1\\s*blister", "\\bblister\\b", "checklane"]

  - id: booster
    name: Booster
    short: Booster
    packs: 1
    patterns: ["\\bbooster\\b", "\\bboostr?e\\b"]

# Orientačná uvádzacia cena v CZ/SK pri vydaní setu, v eurách.
# NIE je to oficiálne MSRP od Pokémon Company — to sa pre CZ/SK nezverejňuje.
# Sú to ceny, za ktoré sa čerstvo vydaný set v týchto obchodoch bežne predáva;
# odvodené z vlastných dát monitoru pre ME05 Pitch Black (vydaný 17. 7. 2026).
# Slúžia na značku „pod uvádzacou cenou". Kde chýbajú, značka sa nezobrazí.
launch_price_eur:
  booster: 5.99
  blister-3: 17.99
  bundle: 36.90
  half-box: 109.00
  booster-box: 214.00
  etb: 74.90
  ex-box: 24.90
  mini-tin: 12.90

pack_overrides:
  - edition: 30th-celebration
    format: etb
    packs: 10

# Čo zahodiť ešte pred klasifikáciou.
# Poznámka: produkt musí sedieť na edíciu AJ formát, takže príslušenstvo
# a jednotlivé karty vypadnú samy — tu sú len prípady, ktoré by inak prešli.
exclude_patterns:
  - "japon|japan|jap\\.|\\bjp\\b|\\(jap"
  - "glory\\s+of\\s+(the\\s+)?team\\s+rocket"   # japonský názov SV10, nie klasika z r. 2000
  - "[čc][íi]nsk|chinese"
  - "k[óo]rejsk|korean"
  - "\\bcase\\b|\\bcarton\\b"
  - "\\d+\\s*[x×]\\s*(booster\\s+box|bundle)"
  - "po[sš]koden|damaged"
  - "ultra\\s+pro|ultimate\\s+guard|gamegenic|dragon\\s+shield"
  # Súčiastky vybrané zo zapečatených balení sa predávajú zvlášť. Majú v názve
  # formát ("... from ETB"), takže by sa zaradili ako ten formát a rozbili by
  # medián — obaly z Pitch Black ETB za 4,10 € oproti ETB za 82 €.
  - "\\bfrom\\s+etb\\b|\\bz\\s+etb\\b"
  - "sleeves?|rukáv|obaly\\s+na\\s+karty"
  - "playmat|podlo[žz]k|hracia\\s+plocha"
  - "\\bdice\\b|\\bkocky\\b|damage\\s+counter|po[šs]kodenie"
  - "deck\\s+box|divider|predel|toploader|\\bbinder\\b(?!\\s+collection)"
  - "\\bcoin\\b|\\bminca\\b|\\bpin\\b(?!\\s+collection)"
  - "energy\\s+cards|z[áa]kladn[ée]\\s+energie"
